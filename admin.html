<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Mon Ciel Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --polar: #E8EDF4; --sand: #A8BAC8; --cambridge: #7B90A8;
      --blue: #5A7492; --dark: #1E2A35; --gold: #C9943A;
      --white: #fff; --off: #F3F6F9; --text: #2A3542; --muted: #6E80A0;
      --green: #27AE60; --red: #E74C3C; --orange: #E67E22;
    }
    html { font-size: 15px; }
    body { font-family: 'Jost', sans-serif; background: var(--off); color: var(--text);
      -webkit-font-smoothing: antialiased; min-height: 100dvh; }


    /* ── LAYOUT ── */
    .app { display: none; }
    .app.visible { display: flex; min-height: 100dvh; }

    /* SIDEBAR */
    .sidebar { width: 220px; flex-shrink: 0; background: var(--dark);
      display: flex; flex-direction: column; padding: 1.25rem 0; }
    @media(max-width:768px){ .sidebar { display: none; } }
    .sb-logo { padding: .75rem 1.25rem .75rem; border-bottom: 1px solid rgba(255,255,255,.07); text-align: center; }
    .sb-logo img { height: 108px; width: auto; max-width: 100%; object-fit: contain; filter: invert(1); display: inline-block; }
    .sb-user { padding: 1rem 1.25rem; border-bottom: 1px solid rgba(255,255,255,.07); }
    .sb-user-av { width: 32px; height: 32px; border-radius: 50%;
      background: rgba(201,148,58,.2); color: var(--gold);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: .8rem; font-weight: 600; margin-right: .6rem; vertical-align: middle; }
    .sb-user-name { font-size: .83rem; font-weight: 500; color: #fff; vertical-align: middle; }
    .sb-user-role { font-size: .68rem; color: rgba(255,255,255,.3); display: block; margin-top: .1rem; }
    .sb-nav { padding: .8rem 0; flex: 1; }
    .sb-section { font-size: .58rem; font-weight: 700; letter-spacing: .15em;
      text-transform: uppercase; color: rgba(255,255,255,.2); padding: .6rem 1.25rem .3rem; }
    .sb-link { display: flex; align-items: center; gap: .7rem; padding: .6rem 1.25rem;
      font-size: .83rem; color: rgba(255,255,255,.45); cursor: pointer;
      transition: all .2s; border-left: 2px solid transparent; }
    .sb-link:hover { color: rgba(255,255,255,.8); background: rgba(255,255,255,.04); }
    .sb-link.active { color: #fff; border-left-color: var(--gold); background: rgba(255,255,255,.05); }
    .sb-link span { font-size: 1rem; }
    .sb-bottom { padding: 1rem 1.25rem; border-top: 1px solid rgba(255,255,255,.07); }
    .btn-logout { background: none; border: none; color: rgba(255,255,255,.25);
      font-family: 'Jost', sans-serif; font-size: .78rem; cursor: pointer;
      display: flex; align-items: center; gap: .4rem; transition: color .2s; }
    .btn-logout:hover { color: rgba(255,255,255,.6); }

    /* MAIN */
    .main { flex: 1; overflow-y: auto; }
    .main-header { padding: 1.5rem 1.75rem 0; display: flex; align-items: center;
      justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
    .page-title { font-family: 'Cormorant Garamond', serif; font-size: 1.75rem;
      font-weight: 300; color: var(--dark); }
    .page-date { font-size: .8rem; color: var(--muted); }
    .btn-new { padding: .65rem 1.4rem; background: var(--gold); border: none;
      border-radius: 100px; font-family: 'Jost', sans-serif; font-size: .83rem;
      font-weight: 500; color: #fff; cursor: pointer; transition: opacity .2s; }
    .btn-new:hover { opacity: .88; }

    /* STATS */
    .stats-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: .8rem; padding: 1.25rem 1.75rem; }
    .stat-card { background: #fff; border-radius: 14px; padding: 1.1rem;
      box-shadow: 0 1px 12px rgba(30,42,53,.07); }
    .stat-card.gold { background: var(--gold); }
    .stat-card.gold .stat-val, .stat-card.gold .stat-lbl { color: #fff; }
    .stat-val { font-family: 'Cormorant Garamond', serif; font-size: 2rem;
      font-weight: 400; color: var(--dark); line-height: 1; }
    .stat-lbl { font-size: .7rem; font-weight: 500; letter-spacing: .08em;
      text-transform: uppercase; color: var(--muted); margin-top: .35rem; }

    /* DATE BAR */
    .date-bar { padding: 0 1.75rem 1rem; display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
    .date-scroll { display: flex; gap: .5rem; overflow-x: auto; scrollbar-width: none; }
    .date-scroll::-webkit-scrollbar { display: none; }
    .date-chip { padding: .5rem 1rem; border: 1.5px solid var(--polar); border-radius: 100px;
      background: #fff; font-size: .8rem; color: var(--muted); cursor: pointer;
      white-space: nowrap; transition: all .18s; font-family: 'Jost', sans-serif; }
    .date-chip:hover { border-color: var(--cambridge); }
    .date-chip.active { background: var(--dark); border-color: var(--dark); color: #fff; }
    .date-input { padding: .5rem .9rem; border: 1.5px solid var(--polar); border-radius: 100px;
      font-family: 'Jost', sans-serif; font-size: .8rem; color: var(--text);
      outline: none; background: #fff; cursor: pointer; }
    .date-input:focus { border-color: var(--cambridge); }

    /* EMPLOYEE TABS */
    .emp-tabs { display: flex; gap: .4rem; padding: 0 1.75rem .75rem;
      overflow-x: auto; scrollbar-width: none; }
    .emp-tabs::-webkit-scrollbar { display: none; }
    .emp-tab { padding: .4rem 1rem; border-radius: 100px; border: 1.5px solid var(--polar);
      background: #fff; font-size: .8rem; color: var(--muted); cursor: pointer;
      white-space: nowrap; transition: all .18s; font-family: 'Jost', sans-serif; }
    .emp-tab:hover { border-color: var(--cambridge); }
    .emp-tab.active { background: var(--blue); border-color: var(--blue); color: #fff; }

    /* CONTENT AREA */
    .content-area { padding: 0 1.75rem 2rem; }

    /* TIMELINE */
    .timeline { background: #fff; border-radius: 16px; overflow: hidden;
      box-shadow: 0 1px 12px rgba(30,42,53,.07); }
    .timeline-head { padding: .9rem 1.2rem; border-bottom: 1px solid var(--polar);
      display: flex; align-items: center; justify-content: space-between; }
    .timeline-head h3 { font-size: .85rem; font-weight: 600; color: var(--text); }
    .timeline-count { font-size: .75rem; color: var(--muted); }
    .timeline-body { padding: .5rem; position: relative; }
    .tl-hour-row { display: flex; align-items: flex-start; min-height: 64px;
      border-top: 1px solid var(--polar); padding: .4rem 0; }
    .tl-hour-row:first-child { border-top: none; }
    .tl-time { width: 52px; flex-shrink: 0; padding: 0 .6rem;
      font-size: .72rem; color: var(--muted); padding-top: .1rem; }
    .tl-cells { flex: 1; display: flex; flex-wrap: wrap; gap: .4rem; min-height: 48px;
      padding: 0 .3rem; align-content: flex-start; }
    .tl-event { padding: .45rem .75rem; border-radius: 10px; font-size: .75rem;
      cursor: pointer; transition: opacity .2s; max-width: 280px;
      touch-action: manipulation; -webkit-tap-highlight-color: rgba(0,0,0,.08);
      border: none; text-align: left; width: 100%; display: block; font-family: inherit; }
    .tl-event:hover { opacity: .85; }
    .tl-event-svc { font-weight: 600; margin-bottom: .15rem; }
    .tl-event-info { color: rgba(0,0,0,.55); font-size: .7rem; }
    .tl-empty { display: flex; align-items: center; justify-content: center;
      padding: 2.5rem; color: var(--muted); font-size: .88rem; }

    /* EVENT COLORS */
    .ev-cabello { background: #EEF4FB; color: var(--blue); border-left: 3px solid var(--blue); }
    .ev-unas    { background: #FDF0E8; color: #C0693A; border-left: 3px solid var(--orange); }
    .ev-estetica { background: #F0F9F4; color: #1E7A46; border-left: 3px solid var(--green); }
    .ev-otro    { background: var(--polar); color: var(--muted); border-left: 3px solid var(--sand); }

    /* BOOKING LIST */
    .bk-list { display: grid; gap: .65rem; }
    .bk-item { background: #fff; border-radius: 14px; padding: 1rem 1.1rem;
      box-shadow: 0 1px 10px rgba(30,42,53,.06); display: flex; align-items: flex-start;
      gap: .9rem; border-left: 3px solid var(--polar); transition: box-shadow .18s; cursor: pointer; }
    .bk-item:hover { box-shadow: 0 4px 24px rgba(30,42,53,.12); }
    .bk-item.done { opacity: .55; }
    .bk-icon { font-size: 1.3rem; flex-shrink: 0; }
    .bk-body { flex: 1; min-width: 0; }
    .bk-top { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
    .bk-svc { font-weight: 600; font-size: .9rem; }
    .bk-badge { font-size: .65rem; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
      padding: .18rem .55rem; border-radius: 100px; }
    .badge-ok  { background: #E8F8EE; color: var(--green); }
    .badge-done{ background: var(--polar); color: var(--muted); }
    .badge-can { background: #FDECEC; color: var(--red); }
    .bk-meta { font-size: .78rem; color: var(--muted); margin-top: .25rem; }
    .bk-client { font-size: .82rem; color: var(--text); margin-top: .2rem; }
    .bk-actions { display: flex; gap: .4rem; flex-shrink: 0; margin-top: .1rem; }
    .bk-btn { padding: .35rem .7rem; border-radius: 100px; border: 1.5px solid var(--polar);
      background: none; font-family: 'Jost', sans-serif; font-size: .72rem;
      cursor: pointer; color: var(--muted); transition: all .18s; }
    .bk-btn:hover { border-color: var(--cambridge); color: var(--text); }
    .bk-btn.done-btn:hover { background: var(--green); border-color: var(--green); color: #fff; }
    .bk-btn.cancel-btn:hover { background: var(--red); border-color: var(--red); color: #fff; }

    /* EMPTY STATE */
    .empty-state { text-align: center; padding: 3.5rem 1rem; color: var(--muted); }
    .empty-icon { font-size: 2.5rem; margin-bottom: .8rem; opacity: .4; }
    .empty-text { font-size: .9rem; }

    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(30,42,53,.45);
      display: flex; align-items: flex-end; justify-content: center; z-index: 200;
      animation: fadeIn .2s; }
    @media(min-width:600px){ .modal-overlay { align-items: center; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal { background: #fff; border-radius: 20px 20px 0 0; padding: 1.5rem;
      width: 100%; max-width: 480px; max-height: 92dvh; overflow-y: auto;
      animation: slideUp .3s cubic-bezier(.34,1.56,.64,1); }
    @media(min-width:600px){ .modal { border-radius: 20px; } }
    @keyframes slideUp { from { transform: translateY(40px); opacity:0; } to { transform: none; opacity:1; } }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
    .modal-h { font-family: 'Cormorant Garamond', serif; font-size: 1.35rem;
      font-weight: 400; color: var(--dark); }
    .modal-close { background: none; border: none; font-size: 1.2rem; cursor: pointer;
      color: var(--muted); padding: .2rem .4rem; border-radius: 8px; }
    .modal-rows { display: grid; gap: .8rem; }
    .modal-row { display: flex; gap: .8rem; }
    .modal-ico { font-size: 1rem; padding-top: .05rem; }
    .modal-lbl { font-size: .68rem; color: var(--muted); margin-bottom: .1rem; }
    .modal-val { font-size: .92rem; color: var(--text); font-weight: 500; }
    .modal-divider { border: none; border-top: 1px solid var(--polar); margin: .5rem 0; }
    .modal-actions { display: flex; gap: .65rem; margin-top: 1.4rem; }
    .modal-btn { flex: 1; padding: .8rem; border-radius: 100px; border: 1.5px solid var(--polar);
      font-family: 'Jost', sans-serif; font-size: .85rem; cursor: pointer;
      font-weight: 500; transition: all .18s; }
    .modal-btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
    .modal-btn.danger { background: var(--red); border-color: var(--red); color: #fff; }
    .modal-btn.start { background: var(--cambridge); border-color: var(--cambridge); color: #fff; font-size:1rem; }
    .modal-btn.stop  { background: #388E3C; border-color: #388E3C; color: #fff; font-size:1rem; }
    .modal-btn:hover:not(.primary):not(.danger):not(.start):not(.stop) { border-color: var(--cambridge); }
    .status-chip { display:inline-block; padding:.2rem .75rem; border-radius:100px; font-size:.7rem; font-weight:700; letter-spacing:.06em; }
    .chip-confirmada { background:#e8f4ff; color:#1976D2; }
    .chip-en-proceso { background:#fff3e0; color:#E65100; }
    .chip-completada { background:#e8f5e9; color:#2E7D32; }
    .chip-cancelada  { background:#fce4ec; color:#C62828; }
    .timer-big { font-size:2rem; font-weight:700; color:var(--cambridge); font-variant-numeric:tabular-nums; letter-spacing:-.02em; text-align:center; margin:.25rem 0; }
    .timer-label { font-size:.7rem; color:var(--muted); text-align:center; }
    .tl-event.en-proceso { border-left:3px solid #E65100 !important; background:rgba(230,81,0,.08) !important; }
    .tl-event.completada { border-left:3px solid #388E3C !important; background:rgba(56,142,60,.07) !important; opacity:.75; }
    .tl-event.cancelada  { opacity:.35; text-decoration:line-through; }
    .tl-quick-btn { display:inline-block; margin-top:.3rem; padding:.15rem .55rem; border:none; border-radius:100px; font-size:.65rem; font-weight:600; cursor:pointer; }
    .tl-quick-btn.iniciar { background:var(--cambridge); color:#fff; }
    .tl-quick-btn.proceso { background:#E65100; color:#fff; }

    /* UPCOMING CARDS */
    .up-list { display: grid; gap: .75rem; }
    .up-date-header { font-size: .7rem; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; color: var(--muted); padding: .6rem 0 .2rem; }
    .up-card { background: #fff; border-radius: 16px; overflow: hidden;
      box-shadow: 0 1px 10px rgba(30,42,53,.07); cursor: pointer; transition: box-shadow .18s; }
    .up-card:hover { box-shadow: 0 4px 24px rgba(30,42,53,.13); }
    .up-card.done { opacity: .5; }
    .up-head { display: flex; justify-content: space-between; align-items: center;
      padding: 1rem 1.2rem .75rem; border-bottom: 1px solid var(--polar); }
    .up-emp { flex: 1; }
    .up-emp-name { font-family: 'Cormorant Garamond', serif; font-size: 1.35rem;
      font-weight: 500; color: var(--dark); line-height: 1.1; }
    .up-emp-role { font-size: .72rem; color: var(--muted); margin-top: .15rem; }
    .up-datetime { text-align: right; flex-shrink: 0; }
    .up-time { font-size: 1.2rem; font-weight: 600; color: var(--dark); }
    .up-time-label { font-size: .7rem; color: var(--muted); margin-top: .1rem; }
    .up-body { padding: .75rem 1.2rem 1rem; display: flex; align-items: flex-end;
      justify-content: space-between; gap: .5rem; }
    .up-info { flex: 1; }
    .up-svc { font-size: .92rem; font-weight: 600; color: var(--text); }
    .up-client { font-size: .8rem; color: var(--muted); margin-top: .25rem; }
    .up-badge { font-size: .63rem; font-weight: 700; letter-spacing: .07em;
      text-transform: uppercase; padding: .22rem .6rem; border-radius: 100px;
      background: #E8F8EE; color: var(--green); flex-shrink: 0; align-self: flex-end; }

    /* MONTH CALENDAR */
    .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .cal-nav-btn { background: none; border: 1.5px solid var(--polar); border-radius: 100px;
      padding: .45rem .9rem; font-family: 'Jost', sans-serif; font-size: .82rem;
      cursor: pointer; color: var(--muted); transition: all .18s; }
    .cal-nav-btn:hover { border-color: var(--cambridge); color: var(--text); }
    .cal-month-title { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem;
      font-weight: 400; color: var(--dark); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px;
      background: var(--polar); border-radius: 16px; overflow: hidden;
      box-shadow: 0 1px 12px rgba(30,42,53,.07); }
    .cal-dow { background: var(--dark); padding: .55rem .3rem; text-align: center;
      font-size: .65rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      color: rgba(255,255,255,.45); }
    .cal-day { background: #fff; min-height: 80px; padding: .5rem .4rem; cursor: pointer;
      transition: background .15s; }
    .cal-day:hover { background: #F7FAFD; }
    .cal-day.selected { background: #EEF4FB; }
    .cal-day.today .cal-day-num { background: var(--gold); color: #fff; border-radius: 50%;
      width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; }
    .cal-day.other-month { background: var(--off); }
    .cal-day.other-month .cal-day-num { color: var(--sand); }
    .cal-day-num { font-size: .82rem; font-weight: 500; color: var(--text); display: block; margin-bottom: .2rem; }
    .cal-dots { display: flex; flex-wrap: wrap; gap: 2px; }
    .cal-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .cal-dot.cabello { background: var(--blue); }
    .cal-dot.unas    { background: var(--orange); }
    .cal-dot.estetica{ background: var(--green); }
    .cal-dot.otro    { background: var(--sand); }
    .cal-count { font-size: .62rem; color: var(--muted); margin-top: .15rem; }
    .cal-day-detail { background: #fff; border-radius: 16px; padding: 1.25rem;
      box-shadow: 0 1px 12px rgba(30,42,53,.07); margin-top: 1.25rem; }
    .cal-detail-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: .75rem; }
    .cal-detail-title { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; color: var(--dark); }
    .cal-detail-close { background: none; border: none; cursor: pointer; font-size: 1rem; color: var(--muted); padding: .2rem .4rem; }
    @media(max-width:600px) {
      .cal-day { min-height: 58px; padding: .35rem .25rem; }
      .cal-day-num { font-size: .7rem; }
      .cal-count { display: none; }
    }

    .hidden { display: none !important; }
    .mobile-header { display: none; }

    /* ── LOGIN GATE ── */
    #loginGate {
      position: fixed; inset: 0; background: var(--dark);
      display: flex; align-items: center; justify-content: center; z-index: 999;
    }
    #loginGate.gone { display: none; }
    .login-box {
      background: #fff; border-radius: 24px; padding: 2.5rem 2rem;
      width: min(340px, 92vw); text-align: center;
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
    }
    .login-logo { height: 72px; width: auto; margin: 0 auto 1.4rem; display: block; }
    .login-title { font-family: 'Cormorant Garamond', serif; font-size: 1.55rem;
      font-weight: 300; color: var(--dark); margin-bottom: .3rem; }
    .login-sub { font-size: .78rem; color: var(--muted); margin-bottom: 1.6rem; }
    .login-input { width: 100%; padding: .9rem 1rem; border: 1.5px solid var(--polar);
      border-radius: 12px; font-family: 'Jost', sans-serif; font-size: 1.1rem;
      color: var(--text); outline: none; text-align: center; letter-spacing: .3em;
      transition: border-color .18s; }
    .login-input:focus { border-color: var(--cambridge); }
    .login-btn { width: 100%; padding: .9rem; margin-top: .75rem; background: var(--dark);
      border: none; border-radius: 12px; font-family: 'Jost', sans-serif; font-size: .92rem;
      font-weight: 500; color: #fff; cursor: pointer; transition: background .18s; }
    .login-btn:hover { background: var(--blue); }
    .login-error { font-size: .78rem; color: var(--red); margin-top: .65rem; min-height: 1.1em; }

    /* ── GALLERY MANAGER ── */
    .gm-upload { background: #fff; border-radius: 16px; padding: 1.5rem;
      box-shadow: 0 1px 12px rgba(30,42,53,.07); margin-bottom: 1.25rem; }
    .gm-title { font-family: 'Cormorant Garamond', serif; font-size: 1.3rem;
      font-weight: 400; color: var(--dark); margin-bottom: 1rem; }
    .gm-form { display: grid; gap: .75rem; }
    .gm-row { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
    .gm-field label { display: block; font-size: .7rem; font-weight: 600;
      letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: .35rem; }
    .gm-field input, .gm-field select {
      width: 100%; padding: .65rem .9rem; border: 1.5px solid var(--polar);
      border-radius: 10px; font-family: 'Jost', sans-serif; font-size: .88rem;
      color: var(--text); outline: none; background: #fff; transition: border-color .18s; }
    .gm-field input:focus, .gm-field select:focus { border-color: var(--cambridge); }
    .gm-dropzone { border: 2px dashed var(--polar); border-radius: 14px;
      padding: 2rem 1rem; text-align: center; cursor: pointer; transition: all .2s;
      background: var(--off); position: relative; }
    .gm-dropzone:hover, .gm-dropzone.over { border-color: var(--cambridge); background: #EEF4FB; }
    .gm-dropzone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .gm-drop-icon { font-size: 2rem; margin-bottom: .5rem; opacity: .4; }
    .gm-drop-text { font-size: .82rem; color: var(--muted); }
    .gm-drop-text strong { color: var(--cambridge); }
    .gm-preview-strip { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .75rem; }
    .gm-preview-thumb { width: 64px; height: 64px; border-radius: 10px;
      object-fit: cover; border: 2px solid var(--polar); }
    .gm-submit { padding: .8rem 1.6rem; background: var(--dark); border: none;
      border-radius: 100px; font-family: 'Jost', sans-serif; font-size: .88rem;
      font-weight: 500; color: #fff; cursor: pointer; transition: background .18s; }
    .gm-submit:hover { background: var(--blue); }
    .gm-submit:disabled { opacity: .5; cursor: not-allowed; }
    .gm-msg { font-size: .8rem; color: var(--green); margin-top: .5rem; min-height: 1.1em; }
    .gm-msg.err { color: var(--red); }

    .gm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr));
      gap: .75rem; }
    .gm-card { background: #fff; border-radius: 14px; overflow: hidden;
      box-shadow: 0 1px 10px rgba(30,42,53,.07); position: relative; }
    .gm-card img { width: 100%; height: 130px; object-fit: cover; display: block; }
    .gm-card-body { padding: .55rem .65rem .6rem; }
    .gm-card-cat { font-size: .65rem; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: var(--cambridge); }
    .gm-card-lbl { font-size: .78rem; color: var(--text); margin-top: .1rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gm-del { position: absolute; top: .4rem; right: .4rem; width: 26px; height: 26px;
      background: rgba(30,42,53,.65); border: none; border-radius: 50%; color: #fff;
      font-size: .75rem; cursor: pointer; display: flex; align-items: center;
      justify-content: center; transition: background .18s; backdrop-filter: blur(4px); }
    .gm-del:hover { background: var(--red); }
    .gm-empty { text-align: center; padding: 2.5rem; color: var(--muted); font-size: .88rem; }
    @media(max-width:600px){ .gm-row { grid-template-columns: 1fr; } }
    @media(max-width:768px){
      .mobile-header { display: flex; align-items: center; justify-content: space-between;
        padding: 1rem 1.25rem; background: var(--dark); }
      .mobile-header img { height: 30px; width: 100px; object-fit: contain; filter: invert(1); }
      .mobile-header-right { display: flex; align-items: center; gap: .75rem; }
      .mob-user { font-size: .8rem; color: rgba(255,255,255,.6); }
      .mob-logout { background: none; border: none; font-size: .75rem; color: rgba(255,255,255,.35);
        cursor: pointer; font-family: 'Jost', sans-serif; }
      .stats-row { padding: 1rem; }
      .date-bar, .emp-tabs { padding-left: 1rem; padding-right: 1rem; }
      .main-header { padding: 1rem; }
      .content-area { padding: 0 1rem 2rem; }
    }
  </style>
</head>
<body>

<!-- LOGIN GATE -->
<div id="loginGate">
  <div class="login-box">
    <img src="logo.png" alt="Mon Ciel" class="login-logo">
    <div class="login-title">Panel de administración</div>
    <div class="login-sub">Ingresa tu contraseña para continuar</div>
    <input type="password" class="login-input" id="loginInput" placeholder="••••••"
      onkeydown="if(event.key==='Enter')checkLogin()" autocomplete="current-password">
    <button class="login-btn" onclick="checkLogin()">Entrar</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">
  <!-- Mobile header -->
  <div class="mobile-header">
    <img src="logo.png" alt="Mon Ciel">
    <div class="mobile-header-right">
      <span class="mob-user" id="mobUserName"></span>
      <button class="mob-logout" onclick="logout()">Salir</button>
    </div>
  </div>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sb-logo"><img src="logo.png" alt="Mon Ciel"></div>
    <div class="sb-user">
      <div>
        <span class="sb-user-av" id="sbAv">—</span>
        <span class="sb-user-name" id="sbName">—</span>
      </div>
      <span class="sb-user-role" id="sbRole">—</span>
    </div>
    <nav class="sb-nav">
      <div id="managerNav" class="hidden">
        <div class="sb-link active" onclick="showView('calendar')"><span>📅</span> Calendario</div>
        <div class="sb-link" onclick="showView('all')"><span>👥</span> Todas las citas</div>
        <div class="sb-link" onclick="showView('gallery')"><span>📸</span> Galería</div>
        <div class="sb-link" onclick="showView('export')"><span>📊</span> Exportar datos</div>
      </div>
    </nav>
    <div class="sb-bottom">
      <button class="btn-logout" onclick="logout()">← Cerrar sesión</button>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main">
    <div class="main-header">
      <div>
        <h1 class="page-title" id="pageTitle">Mi agenda de hoy</h1>
        <div class="page-date" id="pageDate"></div>
      </div>
      <div style="display:flex;gap:.5rem;align-items:center">
        <button id="btnRefresh" class="btn-new" style="background:transparent;border:1.5px solid var(--polar);color:var(--text);font-size:.85rem;padding:.55rem 1rem" onclick="refreshBookings()" title="Actualizar citas">🔄 Actualizar</button>
        <button class="btn-new" onclick="window.open('booking.html','_blank')">+ Nueva reserva</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-row" id="statsRow"></div>

    <!-- Date selector -->
    <div class="date-bar" id="dateBar">
      <div class="date-scroll" id="dateChips"></div>
      <input type="date" class="date-input" id="dateInput" onchange="selectDateFromInput(this.value)">
    </div>

    <!-- Employee filter (owner only) -->
    <div class="emp-tabs hidden" id="empTabs"></div>

    <!-- Content -->
    <div class="content-area">
      <div id="agendaView"></div>
    </div>
  </main>
</div>

<!-- BOOKING DETAIL MODAL -->
<div class="modal-overlay hidden" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-head">
      <span class="modal-h">Detalle de cita</span>
      <button class="modal-close" onclick="closeModalDirect()">✕</button>
    </div>
    <div class="modal-rows" id="modalContent"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════
// DATA
// ═══════════════════════════════════

const CAT_MAP = {
  'corte':'cabello','coloracion':'cabello','tratamiento':'cabello','lavado':'cabello',
  'semi-m':'unas','semi-p':'unas','rubber':'unas','acrilicas':'unas',
  'depilacion':'estetica','lifting':'estetica','facial':'estetica',
};
const MONTHS_ES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DOW_ES = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

// ═══════════════════════════════════
// STATE
// ═══════════════════════════════════
let CU = null; // current user
let SEL_DATE = new Date();
let SEL_EMP = 'all';
let CURRENT_VIEW = 'calendar';
let CAL_YEAR = new Date().getFullYear();
let CAL_MONTH = new Date().getMonth();

// ═══════════════════════════════════
// INIT
// ═══════════════════════════════════
// ═══════════════════════════════════
// LOGIN
// ═══════════════════════════════════
const _PH = '9b04f5410f803df1f5f93aa3778059efe90db326c19f5d7ba85414c96739b3bd';

async function checkLogin() {
  const val = document.getElementById('loginInput').value;
  if (!val) return;
  const buf  = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(val));
  const hash = Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  if (hash === _PH) {
    sessionStorage.setItem('mc_auth','1');
    document.getElementById('loginGate').classList.add('gone');
    enter();
  } else {
    document.getElementById('loginError').textContent = 'Contraseña incorrecta';
    document.getElementById('loginInput').value = '';
    document.getElementById('loginInput').focus();
  }
}

document.addEventListener('DOMContentLoaded', () => {
  updatePageDate();
  if (sessionStorage.getItem('mc_auth') === '1') {
    document.getElementById('loginGate').classList.add('gone');
    enter();
  } else {
    setTimeout(() => document.getElementById('loginInput')?.focus(), 100);
  }
});

function enter() {
  document.getElementById('app').classList.add('visible');
  document.getElementById('sbAv').textContent = 'MC';
  document.getElementById('sbName').textContent = 'Mon Ciel Studio';
  document.getElementById('sbRole').textContent = 'Administración';
  document.getElementById('mobUserName').textContent = 'Admin';

  document.getElementById('managerNav').classList.remove('hidden');
  document.getElementById('empTabs').classList.remove('hidden');
  buildEmpTabs();

  SEL_EMP = 'all';
  loadView();
  fetchBookingsFromSheets().then(() => loadView());
}

function logout() {
  sessionStorage.removeItem('mc_auth');
  window.location.reload();
}

// ═══════════════════════════════════
// VIEWS
// ═══════════════════════════════════
function showView(v) {
  CURRENT_VIEW = v;
  document.querySelectorAll('.sb-link').forEach(l => l.classList.remove('active'));
  event?.target?.closest('.sb-link')?.classList.add('active');
  loadView();
}

function loadView() {
  const all = getBookings();
  const v = CURRENT_VIEW;

  if (v === 'calendar') {
    document.getElementById('dateBar').style.display = 'none';
    document.getElementById('statsRow').innerHTML = '';
    renderMonthCalendar(all);
    document.getElementById('pageTitle').textContent = 'Calendario';
  }
  if (v === 'all') {
    document.getElementById('dateBar').style.display = 'flex';
    buildDateChips();
    const filtered = filterBookings(all);
    renderStats(filtered);
    renderTimeline(filtered);
    document.getElementById('pageTitle').textContent = `Citas — ${fmtDate(SEL_DATE)}`;
  }
  if (v === 'export') {
    document.getElementById('dateBar').style.display = 'none';
    document.getElementById('statsRow').innerHTML = '';
    renderExport(all);
    document.getElementById('pageTitle').textContent = 'Exportar datos';
  }
  if (v === 'gallery') {
    document.getElementById('dateBar').style.display = 'none';
    document.getElementById('empTabs').classList.add('hidden');
    document.getElementById('statsRow').innerHTML = '';
    document.getElementById('pageTitle').textContent = 'Galería de fotos';
    renderGallery();
  }
  updatePageDate();
}

// ═══════════════════════════════════
// FILTER
// ═══════════════════════════════════
function toLocalDateStr(d) {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function isEmpAny(empId) {
  return !empId || empId === 'any' || empId === 'sin preferencia';
}
function filterBookings(all) {
  const dstrISO = toLocalDateStr(SEL_DATE);
  const dstrRaw = SEL_DATE.toDateString();
  return all.filter(b => {
    const bdate = b.date || '';
    if (bdate !== dstrISO && bdate !== dstrRaw) return false;
    if (SEL_EMP !== 'all' && b.empId !== SEL_EMP && !isEmpAny(b.empId)) return false;
    return true;
  });
}

// ═══════════════════════════════════
// STATS
// ═══════════════════════════════════
function renderStats(bookings) {
  const active = bookings.filter(b => b.status !== 'cancelada');
  const done   = bookings.filter(b => b.status === 'completada');
  const rev    = done.reduce((s,b) => s + (b.svcPrice||0), 0);

  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card gold">
      <div class="stat-val">${active.length}</div>
      <div class="stat-lbl">Citas hoy</div>
    </div>
    <div class="stat-card">
      <div class="stat-val">${done.length}</div>
      <div class="stat-lbl">Completadas</div>
    </div>
    <div class="stat-card">
      <div class="stat-val">₡${Math.floor(rev/1000)}K</div>
      <div class="stat-lbl">Ingresos del día</div>
    </div>
    <div class="stat-card">
      <div class="stat-val">${bookings.filter(b=>b.status==='cancelada').length}</div>
      <div class="stat-lbl">Canceladas</div>
    </div>`;
}

// ═══════════════════════════════════
// TIMELINE
// ═══════════════════════════════════
function renderTimeline(bookings) {
  const container = document.getElementById('agendaView');

  if (!bookings.length) {
    container.innerHTML = `
      <div class="timeline"><div class="tl-empty">
        <div><div class="empty-icon">📭</div>
        <div class="empty-text">No hay citas para este día</div></div>
      </div></div>`;
    return;
  }

  const HOURS = Array.from({length:10}, (_,i)=>i+9);
  let rows = '';
  HOURS.forEach(h => {
    const ts = `${String(h).padStart(2,'0')}:00`;
    const events = bookings.filter(b => b.time && b.time.startsWith(ts.slice(0,2)));
    const evHtml = events.map(b => {
      const cat = CAT_MAP[b.svcId]||'otro';
      const emp = b.empId==='any'?'Sin preferencia':b.empName||b.empId;
      const st = b.status || 'confirmada';
      let extra = '';
      if (st === 'confirmada') {
        extra = `<button class="tl-quick-btn iniciar" onclick="event.stopPropagation();iniciarCita('${b.id}')">▶ Iniciar</button>`;
      } else if (st === 'en proceso') {
        const elapsed = formatElapsed(getTimerElapsed(b.id));
        extra = `<span class="tl-quick-btn proceso" id="tl-timer-${b.id}" style="pointer-events:none">⏱ ${elapsed}</span>`;
      }
      return `<button class="tl-event ev-${cat} ${st.replace(' ','-')}" onclick="openModal('${b.id}')">
        <div class="tl-event-svc">${b.svcName}</div>
        <div class="tl-event-info">${b.clientName} · ${emp} · ${fmtTime(b.time)}</div>
        ${extra}
      </button>`;
    }).join('');
    rows += `<div class="tl-hour-row">
      <div class="tl-time">${ts}</div>
      <div class="tl-cells">${evHtml}</div>
    </div>`;
  });

  container.innerHTML = `
    <div class="timeline">
      <div class="timeline-head">
        <h3>Horario del día — ${fmtDate(SEL_DATE)}</h3>
        <span class="timeline-count">${bookings.length} cita${bookings.length!==1?'s':''}</span>
      </div>
      <div class="timeline-body">${rows}</div>
    </div>`;

  // Live timer ticks for "en proceso" cards
  const inProcess = bookings.filter(b => (b.status||'confirmada') === 'en proceso');
  if (inProcess.length && !_tlTimerInterval) {
    _tlTimerInterval = setInterval(() => {
      inProcess.forEach(b => {
        const el = document.getElementById('tl-timer-' + b.id);
        if (el) el.textContent = '⏱ ' + formatElapsed(getTimerElapsed(b.id));
      });
    }, 1000);
  }
}

// ═══════════════════════════════════
// UPCOMING LIST
// ═══════════════════════════════════
function renderUpcoming(bookings) {
  const container = document.getElementById('agendaView');
  if (!bookings.length) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">🌸</div><div class="empty-text">No hay citas próximas registradas</div></div>`;
    return;
  }

  let html = '<div class="up-list">';
  let lastDate = '';
  bookings.forEach(b => {
    if (b.date !== lastDate) {
      lastDate = b.date;
      const d = /^\d{4}-\d{2}-\d{2}$/.test(b.date) ? new Date(b.date + 'T00:00:00') : new Date(b.date);
      const isToday = d.toDateString() === new Date().toDateString();
      const label = isToday ? 'Hoy — ' + fmtFull(d) : fmtFull(d);
      html += `<div class="up-date-header">📅 ${label}</div>`;
    }
    html += upcomingCard(b);
  });
  html += '</div>';
  container.innerHTML = html;
}

function upcomingCard(b) {
  const emp = b.empId === 'any' ? 'Sin preferencia' : (b.empName || b.empId);
  const badge = b.status === 'confirmada' ? `<span class="up-badge">Confirmada</span>` : '';
  return `
    <div class="up-card ${b.status==='completada'?'done':''}" onclick="openModal('${b.id}')">
      <div class="up-head">
        <div class="up-emp">
          <div class="up-emp-name">${emp}</div>
        </div>
        <div class="up-datetime">
          <div class="up-time">⏰ ${fmtTime(b.time)}</div>
          <div class="up-time-label">${b.duration ? b.duration + ' min' : ''}</div>
        </div>
      </div>
      <div class="up-body">
        <div class="up-info">
          <div class="up-svc">${b.svcName}</div>
          <div class="up-client">👤 ${b.clientName}${b.clientPhone ? ' · ' + b.clientPhone : ''}</div>
        </div>
        ${badge}
      </div>
    </div>`;
}

// ═══════════════════════════════════
// EXPORT VIEW
// ═══════════════════════════════════
function renderExport(all) {
  const container = document.getElementById('agendaView');
  const csv = toCSV(all);
  container.innerHTML = `
    <div class="timeline" style="padding:1.5rem">
      <p style="font-size:.9rem;color:var(--muted);margin-bottom:1rem">
        Total de reservas guardadas: <strong>${all.length}</strong>
      </p>
      <button class="btn-new" onclick="downloadCSV()">⬇ Descargar CSV</button>
      <div style="margin-top:1.25rem;overflow-x:auto">
        <pre style="font-size:.72rem;color:var(--muted);line-height:1.5;max-height:320px;overflow-y:auto;background:var(--off);padding:1rem;border-radius:10px">${csv.slice(0,2000)}${csv.length>2000?'\n...(truncado)':''}</pre>
      </div>
    </div>`;
}

function toCSV(bookings) {
  const h = 'ID,Fecha,Hora,Servicio,Empleada,Cliente,Teléfono,Email,Precio,Estado\n';
  return h + bookings.map(b =>
    [b.id,b.date,b.time,`"${b.svcName}"`,b.empName||b.empId,`"${b.clientName}"`,b.clientPhone,b.clientEmail||'',b.svcPrice||0,b.status].join(',')
  ).join('\n');
}

function downloadCSV() {
  const all = getBookings();
  const csv = toCSV(all);
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `monciel-reservas-${Date.now()}.csv`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

// ═══════════════════════════════════
// DATE CHIPS
// ═══════════════════════════════════
function buildDateChips() {
  const today = new Date();
  const chips = [];
  for (let i = -1; i <= 6; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() + i);
    chips.push(d);
  }
  document.getElementById('dateChips').innerHTML = chips.map(d => {
    const active = d.toDateString() === SEL_DATE.toDateString();
    const label = d.toDateString() === today.toDateString() ? 'Hoy' :
                  d.toDateString() === new Date(today.setDate(today.getDate()-1)).toDateString() ? 'Ayer' :
                  `${d.getDate()} ${MONTHS_ES[d.getMonth()].slice(0,3)}`;
    return `<div class="date-chip ${active?'active':''}" onclick="selectDate(${d.getFullYear()},${d.getMonth()},${d.getDate()})">${label}</div>`;
  }).join('');
  document.getElementById('dateInput').value = toInputDate(SEL_DATE);
}

function selectDate(y, m, d) {
  SEL_DATE = new Date(y, m, d);
  loadView();
}
function selectDateFromInput(val) {
  const [y,m,d] = val.split('-').map(Number);
  SEL_DATE = new Date(y, m-1, d);
  loadView();
}

// ═══════════════════════════════════
// EMPLOYEE TABS
// ═══════════════════════════════════
const EMPLOYEES = [
  { id: 'marta',   name: 'Marta' },
  { id: 'difrani', name: 'Difrani' },
  { id: 'tatiana', name: 'Tatiana' },
];
function buildEmpTabs() {
  document.getElementById('empTabs').innerHTML = `
    <div class="emp-tab ${SEL_EMP==='all'?'active':''}" onclick="setEmp('all')">Todas</div>
    ${EMPLOYEES.map(e =>
      `<div class="emp-tab ${SEL_EMP===e.id?'active':''}" onclick="setEmp('${e.id}')">${e.name}</div>`
    ).join('')}`;
}
function setEmp(id) {
  SEL_EMP = id;
  buildEmpTabs();
  loadView();
}

// ═══════════════════════════════════
// BOOKING CARD (list view)
// ═══════════════════════════════════
function bookingCard(b) {
  const cat = CAT_MAP[b.svcId]||'otro';
  const badge = { confirmada:'badge-ok', completada:'badge-done', cancelada:'badge-can' }[b.status]||'badge-ok';
  const label = { confirmada:'Confirmada', completada:'Completada', cancelada:'Cancelada' }[b.status]||'—';
  const emp = b.empId==='any'?'Sin preferencia':b.empName||b.empId;
  return `
    <div class="bk-item ${b.status==='completada'?'done':''}" style="border-left-color:${cat==='cabello'?'var(--blue)':cat==='unas'?'var(--orange)':cat==='estetica'?'var(--green)':'var(--sand)'}">
      <div class="bk-icon">${b.svcIcon||'📋'}</div>
      <div class="bk-body">
        <div class="bk-top">
          <span class="bk-svc">${b.svcName}</span>
          <span class="bk-badge ${badge}">${label}</span>
        </div>
        <div class="bk-meta">⏰ ${fmtTime(b.time)} · 👤 ${emp}</div>
        <div class="bk-client">👩 ${b.clientName} · ${b.clientPhone||''}</div>
      </div>
      <div class="bk-actions">
        <button class="bk-btn done-btn" onclick="markStatus('${b.id}','completada',event)" title="Marcar como completada">✓</button>
        <button class="bk-btn cancel-btn" onclick="markStatus('${b.id}','cancelada',event)" title="Cancelar">✕</button>
      </div>
    </div>`;
}

// ═══════════════════════════════════
// MODAL
// ═══════════════════════════════════
function openModal(id) {
  const b = getBookings().find(x => String(x.id) === String(id));
  if (!b) return;
  const emp = b.empId==='any'?'Sin preferencia':b.empName||b.empId;
  const st = b.status || 'confirmada';
  const chipClass = { confirmada:'chip-confirmada', 'en proceso':'chip-en-proceso', completada:'chip-completada', cancelada:'chip-cancelada' }[st] || 'chip-confirmada';
  const chipLabel = { confirmada:'Confirmada', 'en proceso':'En proceso', completada:'Completada', cancelada:'Cancelada' }[st] || st;

  let durationExtra = '';
  if (st === 'completada' && b.actualDuration) {
    durationExtra = `<div class="modal-row"><span class="modal-ico">⏱</span><div>
      <div class="modal-lbl">Duración real</div><div class="modal-val">${b.actualDuration} min</div></div></div>`;
  }

  document.getElementById('modalContent').innerHTML = `
    <div class="modal-row"><span class="modal-ico">${b.svcIcon||'📋'}</span><div>
      <div class="modal-lbl">Servicio</div><div class="modal-val">${b.svcName}</div></div></div>
    <div class="modal-row"><span class="modal-ico">📅</span><div>
      <div class="modal-lbl">Fecha y hora</div><div class="modal-val">${b.date} · ${fmtTime(b.time)}</div></div></div>
    <div class="modal-row"><span class="modal-ico">👤</span><div>
      <div class="modal-lbl">Especialista</div><div class="modal-val">${emp}</div></div></div>
    <hr class="modal-divider">
    <div class="modal-row"><span class="modal-ico">👩</span><div>
      <div class="modal-lbl">Cliente</div><div class="modal-val">${b.clientName}</div></div></div>
    <div class="modal-row"><span class="modal-ico">📱</span><div>
      <div class="modal-lbl">WhatsApp</div>
      <div class="modal-val"><a href="https://wa.me/${String(b.clientPhone||'').replace(/\D/g,'')}" target="_blank" style="color:var(--blue)">${b.clientPhone}</a></div></div></div>
    ${b.clientEmail?`<div class="modal-row"><span class="modal-ico">✉️</span><div>
      <div class="modal-lbl">Correo</div><div class="modal-val">${b.clientEmail}</div></div></div>`:''}
    ${b.clientNotes?`<div class="modal-row"><span class="modal-ico">📝</span><div>
      <div class="modal-lbl">Notas</div><div class="modal-val">${b.clientNotes}</div></div></div>`:''}
    <hr class="modal-divider">
    <div class="modal-row"><span class="modal-ico">💰</span><div>
      <div class="modal-lbl">Precio estimado</div><div class="modal-val">₡${(b.svcPrice||0).toLocaleString()}</div></div></div>
    <div class="modal-row"><span class="modal-ico">🔖</span><div>
      <div class="modal-lbl">Estado</div><div class="modal-val"><span class="status-chip ${chipClass}">${chipLabel}</span></div></div></div>
    ${durationExtra}`;

  let actionsHtml = '';
  if (st === 'confirmada') {
    actionsHtml = `
      <button class="modal-btn start" onclick="iniciarCita('${b.id}')">▶ Iniciar atención</button>
      <button class="modal-btn danger"  onclick="markStatus('${b.id}','cancelada')">✗ Cancelar cita</button>`;
  } else if (st === 'en proceso') {
    actionsHtml = `
      <div style="text-align:center;margin-bottom:.5rem">
        <div class="timer-label">Tiempo transcurrido</div>
        <div class="timer-big" id="modal-timer-${b.id}">${formatElapsed(getTimerElapsed(b.id))}</div>
      </div>
      <button class="modal-btn stop" onclick="terminarCita('${b.id}')">✓ Terminar atención</button>
      <button class="modal-btn danger"  onclick="markStatus('${b.id}','cancelada')">✗ Cancelar cita</button>`;
  } else if (st === 'completada') {
    actionsHtml = `<div style="text-align:center;color:var(--muted);font-size:.85rem">Cita completada ✓</div>`;
  } else if (st === 'cancelada') {
    actionsHtml = `<div style="text-align:center;color:var(--muted);font-size:.85rem">Cita cancelada</div>`;
  }
  document.getElementById('modalActions').innerHTML = actionsHtml;
  document.getElementById('modalOverlay').classList.remove('hidden');

  if (st === 'en proceso') {
    if (_modalTimerInterval) clearInterval(_modalTimerInterval);
    _modalTimerInterval = setInterval(() => {
      const el = document.getElementById('modal-timer-' + b.id);
      if (!el) { clearInterval(_modalTimerInterval); _modalTimerInterval = null; return; }
      el.textContent = formatElapsed(getTimerElapsed(b.id));
    }, 1000);
  }
}
function closeModal(e) { if (e.target === document.getElementById('modalOverlay')) closeModalDirect(); }
function closeModalDirect() {
  document.getElementById('modalOverlay').classList.add('hidden');
  if (_modalTimerInterval) { clearInterval(_modalTimerInterval); _modalTimerInterval = null; }
}

// ═══════════════════════════════════
// ACTIONS
// ═══════════════════════════════════
let _modalTimerInterval = null;
let _tlTimerInterval = null;

function formatElapsed(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function getTimerElapsed(id) {
  const start = localStorage.getItem('mc_timer_' + id);
  if (!start) return 0;
  return Math.floor((Date.now() - parseInt(start)) / 1000);
}

async function iniciarCita(id) {
  localStorage.setItem('mc_timer_' + id, Date.now().toString());
  const bookings = getBookings();
  const idx = bookings.findIndex(b => String(b.id) === String(id));
  if (idx !== -1) { bookings[idx].status = 'en proceso'; _cachedBookings = bookings; saveBookings(bookings); }
  updateBookingInSheets(id, { status: 'en proceso' });
  if (_tlTimerInterval) { clearInterval(_tlTimerInterval); _tlTimerInterval = null; }
  loadView();
  openModal(id);
}

async function terminarCita(id) {
  const elapsed = getTimerElapsed(id);
  const minutes = Math.max(1, Math.round(elapsed / 60));
  localStorage.removeItem('mc_timer_' + id);
  if (_modalTimerInterval) { clearInterval(_modalTimerInterval); _modalTimerInterval = null; }
  if (_tlTimerInterval) { clearInterval(_tlTimerInterval); _tlTimerInterval = null; }
  const bookings = getBookings();
  const idx = bookings.findIndex(b => String(b.id) === String(id));
  if (idx !== -1) {
    bookings[idx].status = 'completada';
    bookings[idx].actualDuration = minutes;
    _cachedBookings = bookings;
    saveBookings(bookings);
  }
  updateBookingInSheets(id, { status: 'completada', actualDuration: minutes });
  closeModalDirect();
  loadView();
}

async function updateBookingInSheets(id, updates) {
  try {
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'updateBooking', id, updates }),
    });
  } catch(e) { /* silent — status already saved locally */ }
}

function markStatus(id, status, e) {
  if (e) e.stopPropagation();
  const bookings = getBookings();
  const idx = bookings.findIndex(b => String(b.id) === String(id));
  if (idx === -1) return;
  bookings[idx].status = status;
  _cachedBookings = bookings;
  saveBookings(bookings);
  updateBookingInSheets(id, { status });
  closeModalDirect();
  loadView();
}

// ═══════════════════════════════════
// STORAGE
// ═══════════════════════════════════
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwqwrO-SKpfCk13vrflo_Duauh4BjN-s9U0Lk32bHeOMy_31IcgwtuJO1b7gQcP3_uWpQ/exec';
let _cachedBookings = null;

async function fetchBookingsFromSheets(retries = 3) {
  for (let i = 0; i < retries; i++) {
    try {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'list' }),
      });
      const data = await res.json();
      if (data.ok && Array.isArray(data.bookings)) {
        _cachedBookings = data.bookings;
        localStorage.setItem('mc_bookings', JSON.stringify(data.bookings));
        return data.bookings;
      }
    } catch(e) {
      if (i < retries - 1) await new Promise(r => setTimeout(r, 2000));
    }
  }
  try { return JSON.parse(localStorage.getItem('mc_bookings') || '[]'); } catch { return []; }
}

function getBookings() {
  if (_cachedBookings) return _cachedBookings;
  try { return JSON.parse(localStorage.getItem('mc_bookings') || '[]'); } catch { return []; }
}
function saveBookings(b) { localStorage.setItem('mc_bookings', JSON.stringify(b)); }

async function refreshBookings() {
  await fetchBookingsFromSheets();
  loadView();
}

// ═══════════════════════════════════
// UTILS
// ═══════════════════════════════════
function updatePageDate() {
  const now = new Date();
  document.getElementById('pageDate').textContent =
    `${DOW_ES[now.getDay()]}, ${now.getDate()} de ${MONTHS_ES[now.getMonth()]} ${now.getFullYear()}`;
}
function fmtDate(d) { return `${d.getDate()} de ${MONTHS_ES[d.getMonth()]}`; }
function fmtFull(d) { return `${DOW_ES[d.getDay()]} ${d.getDate()} de ${MONTHS_ES[d.getMonth()]} ${d.getFullYear()}`; }
function fmtTime(t) {
  if (!t) return '—';
  let h, m;
  if (/^\d{1,2}:\d{2}/.test(String(t))) {
    [h, m] = String(t).slice(0, 5).split(':').map(Number);
  } else {
    try { const d = new Date(t); h = d.getHours(); m = d.getMinutes(); }
    catch { return String(t); }
  }
  const ampm = h >= 12 ? 'pm' : 'am';
  const h12 = h % 12 || 12;
  return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
}
function toInputDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// ═══════════════════════════════════
// MONTH CALENDAR
// ═══════════════════════════════════
let CAL_SEL_DAY = null;

function renderMonthCalendar(all) {
  const container = document.getElementById('agendaView');
  const year = CAL_YEAR, month = CAL_MONTH;
  const today = new Date();

  const firstDay = new Date(year, month, 1);
  const lastDay  = new Date(year, month + 1, 0);
  const startDow = firstDay.getDay();

  function dayBookings(d) {
    const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    return all.filter(b => {
      if (b.status === 'cancelada') return false;
      const bd = b.date || '';
      if (/^\d{4}-\d{2}-\d{2}$/.test(bd)) return bd === ds;
      try { return toLocalDateStr(new Date(bd)) === ds; } catch { return false; }
    });
  }

  const cells = [];
  for (let i = 0; i < startDow; i++) {
    cells.push({ date: new Date(year, month, i - startDow + 1), current: false });
  }
  for (let d = 1; d <= lastDay.getDate(); d++) {
    cells.push({ date: new Date(year, month, d), current: true });
  }
  const remain = 42 - cells.length;
  for (let i = 1; i <= remain; i++) {
    cells.push({ date: new Date(year, month + 1, i), current: false });
  }

  const DOW_LABELS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const monthName = MONTHS_ES[month].charAt(0).toUpperCase() + MONTHS_ES[month].slice(1);

  let gridHtml = DOW_LABELS.map(d => `<div class="cal-dow">${d}</div>`).join('');
  cells.forEach(cell => {
    const bks = dayBookings(cell.date);
    const isToday = cell.date.toDateString() === today.toDateString();
    const isSel   = CAL_SEL_DAY && cell.date.toDateString() === CAL_SEL_DAY.toDateString();
    const dots = bks.slice(0, 5).map(b => {
      const cat = CAT_MAP[b.svcId] || guessCategory(b.svcName);
      return `<div class="cal-dot ${cat}"></div>`;
    }).join('');
    const countTxt = bks.length > 0 ? `<div class="cal-count">${bks.length} cita${bks.length!==1?'s':''}</div>` : '';
    gridHtml += `<div class="cal-day ${!cell.current?'other-month':''} ${isToday?'today':''} ${isSel?'selected':''}"
      onclick="calSelectDay(${cell.date.getFullYear()},${cell.date.getMonth()},${cell.date.getDate()})">
      <span class="cal-day-num">${cell.date.getDate()}</span>
      <div class="cal-dots">${dots}</div>
      ${countTxt}
    </div>`;
  });

  let detailHtml = '';
  if (CAL_SEL_DAY) {
    const selBks = dayBookings(CAL_SEL_DAY);
    detailHtml = `<div class="cal-day-detail">
      <div class="cal-detail-head">
        <span class="cal-detail-title">📅 ${fmtFull(CAL_SEL_DAY)}</span>
        <button class="cal-detail-close" onclick="CAL_SEL_DAY=null;renderMonthCalendar(getBookings())">✕</button>
      </div>`;
    if (!selBks.length) {
      detailHtml += `<div class="tl-empty"><div><div class="empty-icon">🌸</div><div class="empty-text">Sin citas este día</div></div></div>`;
    } else {
      const HOURS = Array.from({length:10}, (_,i)=>i+9);
      let rows = '';
      HOURS.forEach(h => {
        const ts = `${String(h).padStart(2,'0')}:00`;
        const events = selBks.filter(b => b.time && b.time.startsWith(String(h).padStart(2,'0')));
        if (!events.length) return;
        const evHtml = events.map(b => {
          const cat = CAT_MAP[b.svcId] || guessCategory(b.svcName);
          const emp = b.empId==='any'?'Sin pref.':b.empName||b.empId;
          const st = b.status || 'confirmada';
          return `<button class="tl-event ev-${cat} ${st.replace(' ','-')}" onclick="openModal('${b.id}')">
            <div class="tl-event-svc">${b.svcName}</div>
            <div class="tl-event-info">${b.clientName} · ${emp} · ${fmtTime(b.time)}</div>
          </button>`;
        }).join('');
        rows += `<div class="tl-hour-row">
          <div class="tl-time">${ts}</div>
          <div class="tl-cells">${evHtml}</div>
        </div>`;
      });
      detailHtml += `<div class="timeline-body" style="border-top:1px solid var(--polar)">${rows}</div>`;
    }
    detailHtml += `</div>`;
  }

  container.innerHTML = `
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="calPrev()">← Anterior</button>
      <span class="cal-month-title">${monthName} ${year}</span>
      <button class="cal-nav-btn" onclick="calNext()">Siguiente →</button>
    </div>
    <div class="cal-grid">${gridHtml}</div>
    ${detailHtml}`;
}

function guessCategory(svcName) {
  if (!svcName) return 'otro';
  const n = svcName.toLowerCase();
  if (n.includes('corte')||n.includes('color')||n.includes('tinte')||n.includes('tratamiento')||n.includes('blower')||n.includes('lavado')) return 'cabello';
  if (n.includes('mani')||n.includes('pedi')||n.includes('uña')) return 'unas';
  if (n.includes('depil')||n.includes('facial')||n.includes('lifting')) return 'estetica';
  return 'otro';
}

function calSelectDay(y, m, d) {
  CAL_SEL_DAY = new Date(y, m, d);
  renderMonthCalendar(getBookings());
}
function calPrev() {
  CAL_MONTH--;
  if (CAL_MONTH < 0) { CAL_MONTH = 11; CAL_YEAR--; }
  CAL_SEL_DAY = null;
  renderMonthCalendar(getBookings());
}
function calNext() {
  CAL_MONTH++;
  if (CAL_MONTH > 11) { CAL_MONTH = 0; CAL_YEAR++; }
  CAL_SEL_DAY = null;
  renderMonthCalendar(getBookings());
}

// ═══════════════════════════════════
// GALLERY MANAGER
// ═══════════════════════════════════
async function renderGallery() {
  const container = document.getElementById('agendaView');
  container.innerHTML = `
    <div class="gm-upload">
      <div class="gm-title">Subir fotos</div>
      <div class="gm-form">
        <div class="gm-dropzone" id="gmDrop">
          <input type="file" id="gmFile" accept="image/*" multiple onchange="gmPreview(this)">
          <div class="gm-drop-icon">🖼️</div>
          <div class="gm-drop-text">Arrastra las fotos aquí o <strong>haz clic para elegir</strong></div>
        </div>
        <div class="gm-preview-strip" id="gmPreviews"></div>
        <div class="gm-row">
          <div class="gm-field">
            <label>Categoría</label>
            <select id="gmCat">
              <option value="cabello">Cabello</option>
              <option value="color">Color</option>
              <option value="unas">Uñas</option>
            </select>
          </div>
          <div class="gm-field">
            <label>Descripción (opcional)</label>
            <input type="text" id="gmLabel" placeholder="Ej: Corte y color">
          </div>
        </div>
        <div>
          <button class="gm-submit" id="gmSubmit" onclick="gmUpload()">Subir fotos</button>
          <div class="gm-msg" id="gmMsg"></div>
        </div>
      </div>
    </div>
    <div class="gm-upload">
      <div class="gm-title">Fotos actuales</div>
      <div id="gmGrid"><div class="gm-empty">Cargando...</div></div>
    </div>`;

  const drop = document.getElementById('gmDrop');
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => {
    e.preventDefault(); drop.classList.remove('over');
    document.getElementById('gmFile').files = e.dataTransfer.files;
    gmPreview(document.getElementById('gmFile'));
  });

  gmLoadGrid();
}

function gmPreview(input) {
  const strip = document.getElementById('gmPreviews');
  strip.innerHTML = '';
  Array.from(input.files).forEach(f => {
    const img = document.createElement('img');
    img.className = 'gm-preview-thumb';
    img.src = URL.createObjectURL(f);
    strip.appendChild(img);
  });
}

async function gmUpload() {
  const files = document.getElementById('gmFile').files;
  if (!files.length) { gmSetMsg('Selecciona al menos una foto', true); return; }

  const btn = document.getElementById('gmSubmit');
  btn.disabled = true;
  let ok = 0, fail = 0;

  for (const file of files) {
    const fd = new FormData();
    fd.append('action', 'upload');
    fd.append('photo', file);
    fd.append('category', document.getElementById('gmCat').value);
    fd.append('label', document.getElementById('gmLabel').value);
    fd.append('size', 'normal');
    try {
      const r = await fetch('gallery-upload.php', { method: 'POST', body: fd });
      const d = await r.json();
      if (d.success) ok++; else fail++;
    } catch { fail++; }
  }

  btn.disabled = false;
  document.getElementById('gmFile').value = '';
  document.getElementById('gmPreviews').innerHTML = '';
  document.getElementById('gmLabel').value = '';

  if (fail === 0) gmSetMsg(`✓ ${ok} foto${ok>1?'s':''} subida${ok>1?'s':''} correctamente`);
  else gmSetMsg(`${ok} subidas, ${fail} con error`, true);

  gmLoadGrid();
}

async function gmLoadGrid() {
  const grid = document.getElementById('gmGrid');
  if (!grid) return;
  try {
    const r = await fetch('gallery-upload.php?action=list');
    const d = await r.json();
    if (!d.images || !d.images.length) {
      grid.innerHTML = '<div class="gm-empty">No hay fotos todavía</div>';
      return;
    }
    grid.innerHTML = '<div class="gm-grid">' +
      d.images.map(img => `
        <div class="gm-card" id="gmc-${img.filename}">
          <img src="${img.url}" alt="${img.label||''}">
          <button class="gm-del" onclick="gmDelete('${img.filename}')" title="Eliminar">✕</button>
          <div class="gm-card-body">
            <div class="gm-card-cat">${img.category}</div>
            <div class="gm-card-lbl">${img.label || '—'}</div>
          </div>
        </div>`).join('') +
      '</div>';
  } catch {
    grid.innerHTML = '<div class="gm-empty">No se pudo cargar las fotos</div>';
  }
}

async function gmDelete(filename) {
  if (!confirm('¿Eliminar esta foto?')) return;
  const fd = new FormData();
  fd.append('action', 'delete');
  fd.append('filename', filename);
  try {
    const r = await fetch('gallery-upload.php', { method: 'POST', body: fd });
    const d = await r.json();
    if (d.success) {
      const card = document.getElementById('gmc-' + filename);
      if (card) card.remove();
    } else {
      alert('Error al eliminar');
    }
  } catch { alert('Error de conexión'); }
}

function gmSetMsg(txt, isErr = false) {
  const el = document.getElementById('gmMsg');
  if (!el) return;
  el.textContent = txt;
  el.className = 'gm-msg' + (isErr ? ' err' : '');
  setTimeout(() => { if(el) el.textContent = ''; }, 4000);
}
</script>
